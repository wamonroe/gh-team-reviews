name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # For artifact attestations, which need a public repo.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build with the latest stable Go (not just the go.mod minimum) so each
      # release picks up standard library security fixes.
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version: stable
          generate_attestations: true
